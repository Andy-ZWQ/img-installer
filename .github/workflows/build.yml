name: "Build Armbian Installer ISO"
on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "版本类型"
        required: true
        default: "standard"
        type: choice
        options:
          - "standard"
          - "debian13_minimal"
          - "ubuntu26_minimal"

jobs:
  build-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      VERSION_TYPE: ${{ github.event.inputs.version_type }}
    steps:
      - uses: actions/checkout@v5

      - name: Build Image
        run: ./build.sh

      - name: Debug - 查看output原始文件
        run: |
          pwd
          ls -la ./output/

      - name: "Prepare Release Assets"
        run: |
          SRC_ISO="output/armbian-installer-x86_64-standard.iso"
          if [ ! -f "$SRC_ISO" ]; then
            echo "❌ 源ISO不存在：$SRC_ISO"
            exit 1
          fi

          if [ "$VERSION_TYPE" = "debian13_minimal" ]; then
            mv "$SRC_ISO" output/armbian-installer-x86_64-debian13_minimal.iso
          elif [ "$VERSION_TYPE" = "ubuntu26_minimal" ]; then
            mv "$SRC_ISO" output/armbian-installer-x86_64-ubuntu26_minimal.iso
          fi
          # standard 不做重命名，保留原名

          echo "✅ 重命名完成，output目录："
          ls -la ./output/

      - name: "Publish"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "Armbian-Installer-x86_64-ISO"
          body_path: ${{ github.workspace }}/info.md
          files: |
            output/armbian-installer-x86_64-${{ github.event.inputs.version_type }}.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
